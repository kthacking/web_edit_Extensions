<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Live Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <!-- Top Toolbar -->
    <div class="toolbar-top">
        <div class="toolbar-brand">
            <i class="fa-solid fa-layer-group"></i> LiveEditor
        </div>
        <div class="toolbar-actions">
            <button class="tool-btn active" title="Enable Edit Mode"><i class="fa-solid fa-pen-to-square"></i>
                Edit</button>
            <div class="divider"></div>
            <button class="tool-btn" title="Select"><i class="fa-solid fa-arrow-pointer"></i></button>
            <button class="tool-btn" title="Move"><i class="fa-solid fa-up-down-left-right"></i></button>
            <button class="tool-btn" title="Resize"><i class="fa-solid fa-expand"></i></button>
            <button class="tool-btn" title="Delete"><i class="fa-solid fa-trash"></i></button>
            <div class="divider"></div>
            <button class="tool-btn" title="Add Text"><i class="fa-solid fa-font"></i></button>
            <button class="tool-btn" title="Add Image"><i class="fa-regular fa-image"></i></button>
            <button class="tool-btn" title="Add Button"><i class="fa-solid fa-mobile-button"></i></button>
        </div>
        <div class="toolbar-meta">
            <span class="view-mode">Desktop <i class="fa-solid fa-chevron-down"></i></span>
            <button class="publish-btn">Publish</button>
        </div>
    </div>

    <!-- Main Workspace (Mock E-commerce Site) -->
    <div class="workspace-container">

        <!-- Mock Website Content -->
        <main class="mock-site">
            <!-- Header -->
            <header class="site-header editable-element selected-element">
                <div class="site-logo editable-element">ShopKart</div>
                <div class="search-bar editable-element">
                    <input type="text" placeholder="Search for products, brands and more">
                    <button><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <div class="header-nav editable-element">
                    <span>Login</span>
                    <span>More</span>
                    <span><i class="fa-solid fa-cart-shopping"></i> Cart</span>
                </div>

                <!-- Editor Overlay (Selection UI) -->
                <div class="editor-overlay">
                    <div class="resize-handle handle-tl"></div>
                    <div class="resize-handle handle-tr"></div>
                    <div class="resize-handle handle-bl"></div>
                    <div class="resize-handle handle-br"></div>
                    <div class="edit-badge"><i class="fa-solid fa-pen"></i> Header</div>
                </div>
            </header>

            <!-- Hero Section -->
            <section class="hero-section editable-element">
                <div class="hero-content">
                    <h1>Big Summer Sale</h1>
                    <p>Up to 80% off on top brands</p>
                    <button class="cta-btn editable-element">Shop Now</button>
                </div>
                <div class="hero-image">
                    <!-- Placeholder visual for electronics -->
                    <div class="img-placeholder"><i class="fa-solid fa-headphones-simple"></i></div>
                </div>
            </section>

            <!-- Product Grid -->
            <section class="products-section editable-element">
                <h2>Best of Electronics</h2>
                <div class="product-grid">
                    <!-- Product Card 1 -->
                    <div class="product-card editable-element">
                        <div class="card-img"><i class="fa-solid fa-camera"></i></div>
                        <div class="card-info">
                            <h3>DSLR Camera</h3>
                            <p class="price">$499</p>
                            <span class="offer">Min 40% Off</span>
                        </div>
                    </div>
                    <!-- Product Card 2 -->
                    <div class="product-card editable-element">
                        <div class="card-img"><i class="fa-solid fa-laptop"></i></div>
                        <div class="card-info">
                            <h3>Gaming Laptop</h3>
                            <p class="price">$1299</p>
                            <span class="offer">Min 20% Off</span>
                        </div>
                    </div>
                    <!-- Product Card 3 -->
                    <div class="product-card editable-element">
                        <div class="card-img"><i class="fa-solid fa-mobile-screen"></i></div>
                        <div class="card-info">
                            <h3>Smartphone 5G</h3>
                            <p class="price">$299</p>
                            <span class="offer">New Launch</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- Right Panel (Style Editor) -->
    <aside class="properties-panel">
        <div class="panel-header">
            <h3>Properties</h3>
            <i class="fa-solid fa-xmark"></i>
        </div>

        <div class="panel-section">
            <label class="section-label">Layout</label>
            <div class="prop-row two-col">
                <div class="input-group">
                    <span>X</span>
                    <input type="text" value="0">
                </div>
                <div class="input-group">
                    <span>Y</span>
                    <input type="text" value="0">
                </div>
            </div>
            <div class="prop-row two-col">
                <div class="input-group">
                    <span>W</span>
                    <input type="text" id="prop-width" value="100%">
                </div>
                <div class="input-group">
                    <span>H</span>
                    <input type="text" id="prop-height" value="Auto">
                </div>
            </div>
            <div class="prop-row">
                <div class="input-group">
                    <span>Display</span>
                    <select>
                        <option>Flex</option>
                        <option>Block</option>
                    </select>
                </div>
            </div>
            <!-- Margin/Padding Visualizer Mock -->
            <div class="spacing-visualizer">
                <div class="margin-box">
                    <span class="label">M</span>
                    <div class="padding-box">
                        <span class="label">P</span>
                        <div class="content-box"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <label class="section-label">Typography</label>
            <div class="prop-row">
                <select>
                    <option>Inter</option>
                    <option>Roboto</option>
                </select>
            </div>
            <div class="prop-row two-col">
                <select>
                    <option>Regular</option>
                    <option>Bold</option>
                </select>
                <input type="text" value="16px">
            </div>
            <div class="prop-row three-col-icons">
                <button class="active"><i class="fa-solid fa-align-left"></i></button>
                <button><i class="fa-solid fa-align-center"></i></button>
                <button><i class="fa-solid fa-align-right"></i></button>
            </div>
        </div>

        <div class="panel-section">
            <label class="section-label">Fill</label>
            <div class="prop-row color-picker-row">
                <div class="color-preview" id="prop-color-preview" style="background: #2874f0;"></div>
                <input type="text" id="prop-color" value="#2874f0">
                <span class="opacity">100%</span>
            </div>
        </div>

        <div class="panel-section">
            <label class="section-label">Border</label>
            <div class="prop-row two-col">
                <input type="text" value="0px">
                <div class="color-preview" style="background: #000;"></div>
            </div>
            <div class="prop-row">
                <div class="input-group">
                    <span>Radius</span>
                    <input type="text" value="4px">
                </div>
            </div>
        </div>

        <div class="panel-section">
            <label class="section-label">Effects</label>
            <div class="prop-row">
                <button class="add-effect-btn"><i class="fa-solid fa-plus"></i> Add Shadow</button>
            </div>
        </div>

    </aside>

    <script src="script.js"></script>
</body>

</html>
